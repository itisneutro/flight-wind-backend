services:
  minio:
    image: minio/minio:latest
    container_name: wind-rhumbs-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - wind-rhumbs-data:/data

volumes:
  wind-rhumbs-data: